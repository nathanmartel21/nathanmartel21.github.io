# Elasticsearch + Kibana — stack mono-nœud pour les logs des apps.
# Sécurité activée, TLS coupé côté HTTP (mets le TLS au niveau de l'exposition :
# Cloudflare Tunnel ou un reverse-proxy). Démarre avec :  docker compose up -d
#
# Prérequis Linux/WSL :  sudo sysctl -w vm.max_map_count=262144
# (persister : echo 'vm.max_map_count=262144' | sudo tee /etc/sysctl.d/99-es.conf)

services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: es
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q status"]
      interval: 10s
      timeout: 5s
      retries: 30

  kib_setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: kib_setup
    depends_on:
      es: { condition: service_healthy }
    restart: "no"
    entrypoint: >
      bash -c "curl -s -u elastic:${ELASTIC_PASSWORD}
      -X POST http://es:9200/_security/user/kibana_system/_password
      -H 'Content-Type: application/json'
      -d '{\"password\":\"${KIBANA_PASSWORD}\"}' && echo ' -> kibana_system OK'"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    depends_on:
      kib_setup: { condition: service_completed_successfully }
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
    ports:
      - "5601:5601"

volumes:
  esdata:
