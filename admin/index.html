<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://ayress21-homemadegarmin.hf.space; base-uri 'none'; object-src 'none'" />
  <title>Admin — demandes d’accès</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../acces/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="head"><span class="logo">🛡️</span><h1>Admin</h1></header>

    <section id="login" class="card" hidden>
      <h2>Connexion admin</h2>
      <div id="step-email">
        <input id="login-email" type="email" placeholder="email admin" autocomplete="email" />
        <button id="send-code" class="btn btn-primary block">Recevoir un code</button>
      </div>
      <div id="step-code" hidden>
        <input id="login-code" type="text" inputmode="numeric" maxlength="6" placeholder="123456" />
        <button id="verify-code" class="btn btn-primary block">Se connecter</button>
      </div>
      <p id="login-msg" class="msg"></p>
    </section>

    <section id="denied" class="card" hidden>
      <h2>Accès refusé</h2>
      <p class="muted small">Ce compte n’est pas administrateur.</p>
      <button id="logout2" class="btn btn-ghost block">Se déconnecter</button>
    </section>

    <section id="console" class="card" hidden>
      <div class="app-head">
        <div><p class="muted small">Admin</p><p id="who" class="who"></p></div>
        <div style="display:flex;gap:.4rem">
          <button id="refresh" class="btn btn-ghost btn-sm">↻</button>
          <button id="logout" class="btn btn-ghost btn-sm">Déconnexion</button>
        </div>
      </div>
      <div class="filters">
        <button class="fbtn active" data-f="pending">En attente</button>
        <button class="fbtn" data-f="approved">Approuvés</button>
        <button class="fbtn" data-f="denied">Refusés</button>
        <button class="fbtn" data-f="all">Tout</button>
      </div>
      <div id="reqs" class="reqs"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
